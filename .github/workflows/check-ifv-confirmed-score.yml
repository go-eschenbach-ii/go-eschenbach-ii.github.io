name: Verify Official IFV Result Correction
on:
  push:
    paths:
      - '.github/workflows/check-ifv-confirmed-score.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate official 10:0 and stale-table safeguards
        run: |
          python -m py_compile scripts/sync_ifv_schedule.py scripts/guard_unverified_recent_results.py scripts/validate_report.py
          python - <<'PY'
          import json,tempfile,pathlib,subprocess,sys,os
          repo=pathlib.Path.cwd()
          obj=json.loads((repo/'data/report.json').read_text())
          confirmed=json.loads((repo/'data/ifv-verified-results.json').read_text())
          fixture=('21.10.2026','FC Hochdorf III','SC Nebikon')
          def key(m):return (m.get('date'),m.get('home'),m.get('away'))
          assert len([m for m in obj['recent_results'] if key(m)==fixture and (m['home_goals'],m['away_goals'])==(10,0)])==1
          assert all(key(m)!=fixture for m in obj['upcoming_matches'])
          assert any(key(m)==fixture and (m['home_goals'],m['away_goals'])==(10,0) for m in confirmed['matches'])
          h=next(m for m in obj['standings'] if m['team']=='FC Hochdorf III')
          n=next(m for m in obj['standings'] if m['team']=='SC Nebikon')
          assert (h['rank'],h['played'],h['points'],h['goals_for'],h['goals_against'])==(1,8,21,49,6)
          assert (n['played'],n['points'],n['goals_against'])==(8,4,44)
          with tempfile.TemporaryDirectory() as t:
            root=pathlib.Path(t)
            (root/'data').mkdir()
            baseline=json.loads(json.dumps(obj))
            baseline['recent_results']=[m for m in baseline['recent_results'] if key(m)!=fixture]
            baseline['standings']=[{**x,'played':7,'wins':6,'points':18,'goals_for':39,'goal_difference':33} if x['team']=='FC Hochdorf III' else {**x,'played':7,'losses':5,'goals_against':34,'goal_difference':-22} if x['team']=='SC Nebikon' else x for x in baseline['standings']]
            (root/'baseline.json').write_text(json.dumps(baseline))
            (root/'data/report.json').write_text(json.dumps(obj))
            (root/'data/ifv-verified-results.json').write_text(json.dumps(confirmed))
            env={**os.environ,'REPORT_BASELINE':str(root/'baseline.json')}
            subprocess.run([sys.executable,str(repo/'scripts/guard_unverified_recent_results.py')],cwd=root,env=env,check=True)
            corrected=json.loads((root/'data/report.json').read_text())
            assert any(key(m)==fixture for m in corrected['recent_results'])
            assert all(key(m)!=fixture for m in corrected['upcoming_matches'])
          print('OFFICIALLY_CONFIRMED_RESULT_KEPT_WITH_STALE_TABLE')
          PY
