name: Probe IFV mirrors
on:
  push:
    paths:
      - '.github/workflows/ifv-source-probe.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test direct IFV and official club mirror
        run: |
          python - <<'PY'
          import urllib.request
          urls=[
          'https://matchcenter.ifv.ch/default.aspx?a=msp&ln=13040&lng=1&ls=25897&oid=7&s=2027&sg=70471',
          'https://club.football.ch/?lng=1&tab=3396&v=376&t=31274&ls=25897&sg=70471&tg=4328790',
          'https://club.football.ch/?lng=1&tab=3410&v=376',
          'https://www.fcschoetz.ch/de/club/teams/team/spielplan-gruppe/%26v%3D376%26t%3D31274%26ls%3D25897%26sg%3D70471']
          for u in urls:
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'de-CH,de;q=0.9'})
              with urllib.request.urlopen(req,timeout=15) as r:
                raw=r.read().decode('utf-8','ignore')
                print(u, 'STATUS',r.status,'LEN',len(raw),'TEAMS',raw.count('FC Eschenbach II'), 'HTML',raw[:60])
            except Exception as e:print(u,'ERROR',str(e))
          PY
      - name: Parse fallback schedule without publishing
        run: |
          python - <<'PY'
          import json
          a=json.load(open('data/report.json'))
          print('BEFORE',[(x.get('date'),x.get('home'),x.get('away')) for x in a.get('upcoming_matches',[])])
          PY
          python scripts/sync_ifv_schedule.py
          python - <<'PY'
          import json
          a=json.load(open('data/report.json'))
          print('STATUS',a.get('schedule_sync_status'),a.get('schedule_sync_source'))
          print('AFTER_FIXTURES',[(x.get('date'),x.get('time'),x.get('home'),x.get('away')) for x in a.get('upcoming_matches',[])])
          print('AFTER_RESULTS',[(x.get('date'),x.get('home'),x.get('away'),x.get('home_goals'),x.get('away_goals')) for x in a.get('recent_results',[])[:15]])
          PY
      - name: Inspect mirrored standings
        run: |
          python - <<'PY'
          import re,html,urllib.request
          url='https://www.fcschoetz.ch/de/club/teams/team/resultate-und-rangliste/%26v%3D376%26t%3D31274'
          try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=15) as r: raw=r.read().decode('utf-8','ignore')
            print('STANDINGS_SOURCE',r.status,len(raw))
            cleaned=re.sub(r'(?is)<script.*?</script>|<style.*?</style>',' ',raw)
            cleaned=html.unescape(re.sub(r'<[^>]*>','\\n',cleaned))
            lines=[' '.join(l.split()) for l in cleaned.splitlines() if l.strip()]
            for i,l in enumerate(lines):
              if l=='FC Eschenbach II' or l.startswith('1.') or '5. Liga - Gruppe 4' in l:
                if i>0:
                  print('MATCH',i,' | '.join(lines[max(0,i-6):min(len(lines),i+27)])[:500])
          except Exception as e:print('STANDINGS_SOURCE_ERROR',str(e))
          PY
