name: Verify grey Eschenbach defeats
on:
  push:
    paths:
      - '.github/workflows/verify-grey-defeat.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test win and loss visual classes
        run: |
          node --check app.js
          node --check theme-enhance.js
          node --check sw.js
          node <<'JS'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const js=fs.readFileSync('app.js','utf8');
          const start=js.indexOf('function recentMatchHTML(');
          const end=js.indexOf('\nconst fixtureKey=',start);
          if(start<0||end<0)throw Error('Match renderer missing');
          const render=vm.runInNewContext(js.slice(start,end)+'\nrecentMatchHTML',
            {scorerNoteForMatch:()=>'',esc:x=>String(x)});
          const base={date:'17.10.2026',time:'18:00',home:'FC Hochdorf III',away:'FC Eschenbach II',home_goals:3,away_goals:0};
          const defeat=render(base,[],[]);
          if(!defeat.includes('class="match eschenbach-loss"'))throw Error('Hochdorf loss is not grey-classed');
          const win=render({...base,home:'FC Eschenbach II',away:'FC Ruswil III',home_goals:11,away_goals:0},[],[]);
          if(win.includes('eschenbach-loss'))throw Error('Ruswil win should remain yellow');
          const awayWin=render({...base,home:'FC Hochdorf III',away:'FC Eschenbach II',home_goals:0,away_goals:3},[],[]);
          if(awayWin.includes('eschenbach-loss'))throw Error('Away win incorrectly marked as defeat');
          const neutral=render({...base,home:'FC Hochdorf III',away:'SC Nebikon',home_goals:3,away_goals:0},[],[]);
          if(neutral.includes('eschenbach-loss'))throw Error('Non-Eschenbach match incorrectly marked as defeat');
          const theme=fs.readFileSync('theme-enhance.js','utf8');
          if(!theme.includes('.match.eschenbach-match.eschenbach-loss .score'))throw Error('Grey score badge CSS missing');
          if(!theme.includes('background:linear-gradient(135deg,#f2f3f5 0%,#d1d5db 100%)!important'))throw Error('Grey match card missing');
          const idx=fs.readFileSync('index.html','utf8');
          if(!idx.includes('app.js?v=33')||!idx.includes('theme-enhance.js?v=5'))throw Error('Browser cache version not bumped');
          console.log('PASSED: Hochdorf loss grey, Ruswil win yellow, unaffected neutral fixtures.');
          JS
