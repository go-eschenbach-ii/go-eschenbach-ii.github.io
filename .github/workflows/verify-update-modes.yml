name: Verify update modes
on:
  push:
    paths: ['.github/workflows/verify-update-modes.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and data-mode tests
        run: |
          node --check admin-update.js
          node --check review-draft.js
          python - <<'PY'
          from pathlib import Path
          import json, subprocess, tempfile, textwrap, os
          y=Path('.github/workflows/daily-report.yml').read_text(encoding='utf-8')
          assert 'inputs.update_review == false' in y
          assert 'inputs.update_review != false' in y
          assert 'Nur Daten ohne Berichtfreigabe direkt veröffentlichen' in y
          assert 'Bericht als geschuetzten Entwurf speichern' in y
          assert 'git push origin HEAD:main' in y
          assert 'heart_cycle_key' in y
          start=y.index('      - name: Bestehende Berichtstexte bei Datenupdate beibehalten')
          end=y.index('      - name: Berichtssprache ohne Gedankenstriche sicherstellen',start)
          section=y[start:end]
          code=textwrap.dedent(section.split("python - <<'PY'\n",1)[1].split('          PY',1)[0])
          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              (root/'data').mkdir()
              old={'title':'Originaltitel','lead':'Originaleinleitung','review':'Alter Bericht','current_situation':'Alte Lage','outlook':'Alter Ausblick','heart_cycle_key':'alte-herzen','standings':[{'team':'Eschenbach','points':21}],'generated_at':'v1'}
              fresh={**old,'title':'Neuer Titel','lead':'Neue Einleitung','review':'Neuer Rückblick','current_situation':'Neue Lage','outlook':'Neuer Ausblick','standings':[{'team':'Eschenbach','points':24}],'generated_at':'v2'}
              (root/'baseline.json').write_text(json.dumps(old),encoding='utf-8')
              (root/'data/report.json').write_text(json.dumps(fresh),encoding='utf-8')
              env={**os.environ,'REPORT_BASELINE':str(root/'baseline.json')}
              subprocess.run(['python','-c',code],cwd=root,env=env,check=True)
              after=json.loads((root/'data/report.json').read_text(encoding='utf-8'))
              for key in ('title','lead','review','current_situation','outlook','heart_cycle_key'):
                  assert after[key]==old[key],(key,after[key])
              assert after['standings'][0]['points']==24
              assert after['generated_at']=='v2'
          print('DATA_UPDATED_TEXT_AND_HEARTS_PRESERVED')
          PY
      - name: Check update service availability
        run: |
          python - <<'PY'
          import json,urllib.request
          endpoint='https://kfpxheegmeupnuzqjqqt.supabase.co/functions/v1/report-update-request-v2'
          request=urllib.request.Request(endpoint,headers={'Origin':'https://go-eschenbach-ii.github.io'})
          with urllib.request.urlopen(request,timeout=20) as response:
              obj=json.load(response)
          assert 'draft_ready' in obj
          print('SERVICE_AVAILABLE',obj.get('pending'),obj.get('phase'))
          PY
