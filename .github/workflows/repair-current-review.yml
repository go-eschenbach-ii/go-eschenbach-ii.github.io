name: Aktuellen Matchrückblick reparieren

on:
  push:
    paths:
      - 'repair-current-review.trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aktuellen Bericht korrigieren
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path='data/report.json'
          with open(path,'r',encoding='utf-8') as f:
              data=json.load(f)

          data['review']=(
              'Eschenbach erwischte gegen den FC Knutwil II einen perfekten Start und ging bereits in der dritten Minute in Führung. '
              'In der Anfangsphase bestimmte Eschenbach das Geschehen, Captain Muff dirigierte das Team mit Übersicht und der Spielaufbau von hinten wirkte gepflegt. '
              'Ab etwa der 25. Minute fand Knutwil jedoch immer besser in die Partie und kam seinerseits zu gefährlichen Abschlüssen; in der 30. Minute landete ein Ball an der Latte. '
              'Auch nach der Pause hatte Knutwil gute Möglichkeiten, doch Eschenbach überstand diese Druckphase. '
              'Entgegen dem Spielverlauf erhöhte Nabulon mit einem Volleyschuss, ehe Knutwil in der 77. Minute mit einem direkt getretenen Freistoss erneut nur die Latte traf. '
              'In der 83. Minute verwandelte Nabulon einen Penalty zum 3:0-Endstand. '
              'Damit feierte Eschenbach den vierten Sieg im vierten Saisonspiel und blieb zum zweiten Mal ohne Gegentor.'
          )

          data['upcoming_matches']=[m for m in data.get('upcoming_matches',[]) if not (
              m.get('date')=='12.09.2026' and m.get('home')=='FC Eschenbach II' and m.get('away')=='FC Knutwil II'
          )]
          data['generated_at']=datetime.now(ZoneInfo('Europe/Zurich')).strftime('%d.%m.%Y %H:%M')

          with open(path,'w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY

      - name: Korrektur speichern
        run: |
          if git diff --quiet -- data/report.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/report.json
          git commit -m "Aktuellen Eschenbach-Rückblick korrigiert"
          git push
