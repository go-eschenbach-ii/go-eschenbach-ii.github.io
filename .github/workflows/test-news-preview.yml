name: Check Neuigkeiten Preview Approval
on:
  push:
    paths: ['.github/workflows/test-news-preview.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax, staged workflow and private preview
        run: |
          node --check review-draft.js
          node --check admin-update.js
          node --check sw.js
          python -m py_compile scripts/stage_report_draft.py
          python - <<'PY'
          import json,urllib.request,urllib.error
          from pathlib import Path
          workflow=Path('.github/workflows/daily-report.yml').read_text(encoding='utf-8')
          js=Path('review-draft.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          assert 'Update zur Vorschau und Freigabe bereitstellen' in workflow
          assert 'scripts/stage_report_draft.py' in workflow
          assert 'git push origin HEAD:main' not in workflow
          assert 'Berichtstexte bei Datenupdate beibehalten' in workflow
          assert "draft.review_required===false" in js or "d.review_required===false" in js
          assert "const saved=await api('save_news'" in js
          assert "review-news-preview" in js
          assert 'review-draft.js?v=2' in index
          assert 'admin-update.js?v=13' in index
          print('PREVIEW_AND_APPROVAL_INTEGRITY_OK')
          base='https://kfpxheegmeupnuzqjqqt.supabase.co/functions/v1/'
          for action in ('status','save_news','publish'):
              data={'action':action,'items':['Fake news']}
              req=urllib.request.Request(base+'report-draft',data=json.dumps(data).encode('utf-8'),method='POST',
                  headers={'Content-Type':'application/json','Origin':'https://go-eschenbach-ii.github.io'})
              try:
                  urllib.request.urlopen(req,timeout=20)
                  raise AssertionError('Public users can access private '+action)
              except urllib.error.HTTPError as e:
                  assert e.code in (401,403),(action,e.code)
                  print('ADMIN_ONLY',action,e.code)
          req=urllib.request.Request(base+'report-update-request-v2',
                  headers={'Origin':'https://go-eschenbach-ii.github.io'})
          with urllib.request.urlopen(req,timeout=20) as res:
              result=json.load(res)
          assert 'review_required' in result and 'draft_ready' in result
          print('REVIEW_MODE_EXPOSED',result['review_required'])
          PY
