name: Diagnose official scorer access
on:
  push:
    paths: ['.github/workflows/test-ifv-goals-access.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate available IFV-backed match center pages
        run: |
          python - <<'PY'
          import urllib.request,html,re
          urls=[
            'https://matchcenter.ifv.ch/Default.aspx?lng=1&oid=7&tg=4328778&v=369',
            'https://matchcenter.el-pl.ch/Default.aspx?lng=1&oid=3&tg=4328778&v=369',
            'https://dev-matchcenter.ifv.ch/default.aspx?lng=1&oid=7&tg=4328778&v=369',
            'https://matchcenter.football.ch/Default.aspx?lng=1&oid=7&tg=4328778&v=369',
            'https://matchcenter.ifv.ch/Default.aspx?lng=1&oid=7&tg=4328797&v=376',
            'https://matchcenter.el-pl.ch/Default.aspx?lng=1&oid=3&tg=4328797&v=376'
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'de-CH'})
              with urllib.request.urlopen(req,timeout=17) as res: raw=res.read().decode('utf-8','replace');code=res.status
              clean=html.unescape(re.sub(r'<[^>]+>','\\n',re.sub(r'(?is)<script.*?</script>|<style.*?</style>',' ',raw)))
              lines=[' '.join(x.split()) for x in clean.splitlines() if x.strip()]
              scorer=[(i,' | '.join(lines[max(0,i-3):i+3])[:250]) for i,line in enumerate(lines) if line.startswith('Torschütze')][:4]
              print('SOURCE',url,'STATUS',code,'HTML',len(raw),'SCORER',scorer,'TITLE',[x for x in lines if 'Meisterschaft - 5. Liga' in x][:1])
            except Exception as e: print('ERROR',url,type(e).__name__,str(e)[:170])
          PY
