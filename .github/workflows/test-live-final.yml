name: Test Final Result Reconciliation
on:
  push:
    paths: ['.github/workflows/test-live-final.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify corrected report
        run: |
          cp data/report.json /tmp/report-before-update.json
          python - <<'PY'
          import json
          p='data/report.json'; d=json.load(open(p))
          for m in d['recent_results']:
            if m.get('date')=='17.10.2026' and m.get('home')=='FC Hochdorf III': m['away_goals']=1
          d.pop('confirmed_live_scores',None)
          d['review']='Eschenbach verlor 1:3 und erzielte einen Ehrentreffer.'
          for r in d['standings']:
            if r['team']=='FC Hochdorf III':r['goals_against']+=1;r['goal_difference']-=1
          json.dump(d,open(p,'w'),ensure_ascii=False)
          PY
          python scripts/reconcile_live_final_scores.py
          python scripts/protect_report_baseline.py
          python - <<'PY'
          import json
          d=json.load(open('data/report.json'))
          m=next(m for m in d['recent_results'] if m.get('date')=='17.10.2026' and m.get('home')=='FC Hochdorf III')
          assert (m['home_goals'],m['away_goals'])==(3,0)
          assert '1:3' not in d['review']
          assert next(r for r in d['standings'] if r['team']=='FC Hochdorf III')['goals_against']==6
          print('RESULT_AND_PROSE_OK')
          PY
