name: Verify Corrected Match Result
on:
  push:
    paths: ['.github/workflows/verify-final-score.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test reports and protected scores
        run: |
          python -m py_compile scripts/reconcile_live_final_scores.py scripts/protect_report_baseline.py
          cp data/report.json /tmp/report-before-update.json
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('data/report.json')
          d=json.loads(f.read_text())
          m=next(x for x in d['recent_results'] if x.get('date')=='17.10.2026' and x.get('home')=='FC Hochdorf III' and x.get('away')=='FC Eschenbach II')
          assert (m['home_goals'],m['away_goals'])==(3,0)
          m['away_goals']=1
          d.pop('confirmed_live_scores',None)
          d['review']='FC Eschenbach II verlor mit 1:3 gegen Hochdorf und erzielte ein Ehrentor.'
          e=next(x for x in d['standings'] if x['team']=='FC Eschenbach II')
          h=next(x for x in d['standings'] if x['team']=='FC Hochdorf III')
          e['goals_for']+=1
          e['goal_difference']+=1
          h['goals_against']+=1
          h['goal_difference']-=1
          f.write_text(json.dumps(d,ensure_ascii=False))
          print('TEST_CORRUPTED_REPORT_CREATED')
          PY
          python scripts/protect_report_baseline.py
          python - <<'PY'
          import json
          d=json.load(open('data/report.json'))
          m=next(x for x in d['recent_results'] if x.get('date')=='17.10.2026' and x.get('home')=='FC Hochdorf III')
          e=next(x for x in d['standings'] if x['team']=='FC Eschenbach II')
          h=next(x for x in d['standings'] if x['team']=='FC Hochdorf III')
          assert (m['home_goals'],m['away_goals'])==(3,0),m
          assert e['goals_for']==29 and e['played']==8 and e['goals_against']==8,e
          assert h['goals_against']==6,h
          assert '1:3' not in d['review'],d['review']
          assert d['confirmed_live_scores'][0]['away_goals']==0
          print('PROTECTED_FINAL_SCORE',m['home_goals'],m['away_goals'])
          PY
      - name: Test live server score reconciliation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('data/report.json')
          d=json.loads(f.read_text())
          for m in d['recent_results']:
            if m.get('date')=='17.10.2026' and m.get('home')=='FC Hochdorf III':
              m['away_goals']=1
          d.pop('confirmed_live_scores',None)
          f.write_text(json.dumps(d,ensure_ascii=False))
          PY
          python scripts/reconcile_live_final_scores.py
          python - <<'PY'
          import json
          d=json.load(open('data/report.json'))
          m=next(x for x in d['recent_results'] if x.get('date')=='17.10.2026' and x.get('home')=='FC Hochdorf III')
          assert (m['home_goals'],m['away_goals'])==(3,0),m
          assert any(x['away_goals']==0 for x in d['confirmed_live_scores'])
          print('SERVER_FINAL_CONFIRMED',m['home_goals'],m['away_goals'])
          PY
