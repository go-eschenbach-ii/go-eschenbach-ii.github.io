name: Verify Approved Publication Plumbing
on:
  push:
    paths: ['.github/workflows/test-approved-publish.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Code syntax and future match regression
        run: |
          node --check admin-update.js
          node --check review-draft.js
          python -m py_compile scripts/publish_approved_report.py scripts/guard_unverified_recent_results.py
          python - <<'PY'
          import json,subprocess,os,tempfile,sys,pathlib
          repo=pathlib.Path.cwd()
          workflow=(repo/'.github/workflows/publish-approved-report.yml').read_text()
          assert 'contents: write' in workflow
          assert 'workflow_dispatch' in workflow
          assert 'publish_approved_report.py' in workflow
          assert 'approval_token' in workflow
          assert 'admin-update.js?v=14' in (repo/'index.html').read_text()
          assert 'review-draft.js?v=3' in (repo/'index.html').read_text()
          baseline=json.loads((repo/'data/report.json').read_text())
          with tempfile.TemporaryDirectory() as td:
            root=pathlib.Path(td)
            (root/'data').mkdir()
            baseline_file=root/'baseline.json'
            baseline_file.write_text(json.dumps(baseline))
            draft=json.loads(json.dumps(baseline))
            fixture={'date':'21.10.2026','time':'20:00','home':'FC Hochdorf III','away':'SC Nebikon','home_goals':10,'away_goals':0}
            draft['recent_results'].insert(0,fixture)
            draft['upcoming_matches']=[x for x in draft['upcoming_matches'] if not (x['date']=='21.10.2026' and x['home']=='FC Hochdorf III')]
            (root/'data/report.json').write_text(json.dumps(draft))
            env={**os.environ,'REPORT_BASELINE':str(baseline_file)}
            subprocess.run([sys.executable,str(repo/'scripts/guard_unverified_recent_results.py')],cwd=root,env=env,check=True)
            fixed=json.loads((root/'data/report.json').read_text())
            assert not any(x['date']=='21.10.2026' and x['home']=='FC Hochdorf III' and x.get('home_goals')==10 for x in fixed['recent_results'])
            assert any(x['date']=='21.10.2026' and x['home']=='FC Hochdorf III' and x['away']=='SC Nebikon' for x in fixed['upcoming_matches'])
            assert fixed['standings']==baseline['standings']
            assert fixed['heart_cycle_key']==baseline['heart_cycle_key']
          print('CODE_AND_PREMATURE_SCORE_GUARD_PASSED')
          PY
      - name: Verify anonymous approval is blocked
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json
          url='https://kfpxheegmeupnuzqjqqt.supabase.co/functions/v1/report-draft'
          for action in ('status','publish','fetch_approved','complete_approved'):
            args={'action':action,'request_id':'57bd801c-98f2-4e01-9380-3759f3c44132','approval_token':'invalid'}
            headers={'Content-Type':'application/json'}
            if action in ('status','publish'): headers['Origin']='https://go-eschenbach-ii.github.io'
            req=urllib.request.Request(url,method='POST',headers=headers,data=json.dumps(args).encode())
            try:
              urllib.request.urlopen(req,timeout=30)
              raise AssertionError('Unauthorised approval accepted: '+action)
            except urllib.error.HTTPError as exc:
              assert exc.code in (401,403),(action,exc.code)
              print('AUTH_REQUIRED',action,exc.code)
          PY
