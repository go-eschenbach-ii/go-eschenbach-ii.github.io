name: Verify IFV check on every update
on:
  push:
    paths:
      - '.github/workflows/verify-ifv-every-update.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live official table, fixtures, and fail-closed checks
        run: |
          python -m py_compile scripts/sync_ifv_table.py scripts/sync_ifv_schedule.py scripts/require_fresh_ifv_sources.py
          cp data/report.json /tmp/report-before-update.json
          python -c "from datetime import datetime,timezone;from pathlib import Path;Path('/tmp/ifv-update-started-at.txt').write_text(datetime.now(timezone.utc).isoformat())"
          IFV_REQUIRE_FRESH=1 python scripts/sync_ifv_table.py
          python scripts/sync_ifv_schedule.py
          IFV_REQUIRE_FRESH=1 python scripts/sync_ifv_table.py
          python scripts/require_fresh_ifv_sources.py
          python - <<'PY'
          import json,os,subprocess,sys,copy
          from pathlib import Path
          p=Path('data/report.json')
          actual=json.loads(p.read_text())
          assert actual['standings_sync_status']=='verified'
          assert actual['schedule_sync_status']=='verified'
          assert len(actual['standings'])==10
          assert sorted(row['rank'] for row in actual['standings'])==list(range(1,11))
          esch=next(row for row in actual['standings'] if row['team']=='FC Eschenbach II')
          assert esch['played']>=9 and esch['points']>=24
          print('ESCHENBACH_CURRENT_OFFICIAL_RANK',esch['rank'],esch['points'])
          assert actual['schedule_sync_source'].startswith('https://')
          assert actual['standings_sync_source'].startswith('https://')
          for field,value in [
              ('schedule_sync_status','unavailable'),
              ('standings_sync_status','last_verified'),
              ('schedule_sync_at','2026-01-01T00:00:00+00:00'),
              ('schedule_sync_source','https://example.com/fake-results')
          ]:
              stale=copy.deepcopy(actual)
              stale[field]=value
              p.write_text(json.dumps(stale),encoding='utf-8')
              result=subprocess.run([sys.executable,'scripts/require_fresh_ifv_sources.py'],capture_output=True,text=True)
              assert result.returncode!=0,(field,result.stdout)
              print('FAIL_CLOSED',field)
          p.write_text(json.dumps(actual),encoding='utf-8')
          workflow=Path('.github/workflows/daily-report.yml').read_text()
          assert 'inputs.update_review == false' in workflow
          assert 'IFV-Rangliste zu Beginn jedes Updates abfragen' in workflow
          assert 'IFV-Spielplan und Resultate zu Beginn jedes Updates abfragen' in workflow
          assert 'python scripts/require_fresh_ifv_sources.py' in workflow
          assert workflow.index('require_fresh_ifv_sources.py')<workflow.index('stage_report_draft.py')
          assert 'IFV_REQUIRE_FRESH: ' in workflow
          print('BOTH_UPDATE_MODES_REQUIRE_OFFICIAL_IFV')
          PY
