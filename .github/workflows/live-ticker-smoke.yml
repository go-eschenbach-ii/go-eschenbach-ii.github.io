name: Check Liveticker
on:
  push:
    paths:
      - '.github/workflows/live-ticker-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser code
        run: |
          node --check live-ticker.js
          node --check sw.js
      - name: Test public read and protected writes
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          url='https://kfpxheegmeupnuzqjqqt.supabase.co/functions/v1/live-ticker'
          origin='https://go-eschenbach-ii.github.io'
          req=urllib.request.Request(url,headers={'Origin':origin})
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          print('PUBLIC_GET',data)
          assert data.get('ok') is True and 'match' in data
          body=json.dumps({'action':'goal','match_key':'17.10.2026|18:00|FC Hochdorf III|FC Eschenbach II','team':'away'}).encode()
          req=urllib.request.Request(url,data=body,headers={'Origin':origin,'Content-Type':'application/json'},method='POST')
          try:
              urllib.request.urlopen(req,timeout=20)
              raise AssertionError('Unauthenticated write was allowed')
          except urllib.error.HTTPError as e:
              response=json.loads(e.read().decode())
              print('UNAUTHORIZED_STATUS',e.code,'RESPONSE',response)
              assert e.code in (401,403)
          PY
