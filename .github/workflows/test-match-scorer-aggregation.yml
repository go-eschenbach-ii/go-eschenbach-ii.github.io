name: Verify per-match scorer aggregation
on:
  push:
    paths: ['.github/workflows/test-match-scorer-aggregation.yml']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test cumulative totals and IFV scorer priority
        run: |
          python -m py_compile scripts/reconcile_scorers_by_match.py scripts/update_report.py
          cp data/report.json /tmp/scorer-baseline.json
          cp data/report.json /tmp/scorer-original.json
          cp data/ifv-match-scorers.json /tmp/ifv-original.json
          REPORT_BASELINE=/tmp/scorer-baseline.json python scripts/reconcile_scorers_by_match.py
          python - <<'PY'
          import json
          d=json.load(open('data/report.json'))
          s={x['name']:x['goals'] for x in d['scorers']}
          assert s['Luis Nabulon']==8 and s['Mino Vidi']==4 and s['Fabio Almeida']==3 and s['Riccardo Caruso']==2,s
          assert d['scorer_audit']['accounted_goals']==39
          assert len(d['scorer_match_ledger']['matches'])==2
          print('PRESERVED_EXISTING',s)
          PY
          cp data/report.json /tmp/scorer-first-pass.json
          REPORT_BASELINE=/tmp/scorer-first-pass.json python scripts/reconcile_scorers_by_match.py
          cmp /tmp/scorer-first-pass.json data/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/report.json')
          d=json.loads(p.read_text())
          d['eschenbach']['goals_for']=42
          d['recent_results'].insert(0,{'date':'10.04.2027','time':'19:30','home':'FC Eschenbach II','away':'FC Altbüron-Grossdietwil','home_goals':2,'away_goals':1})
          d['scorer_audit']['checked_matches'].append({'date':'10.04.2027','opponent':'FC Altbüron-Grossdietwil','result':'2:1','scorers':[{'name':'Luis Nabulon','goals':1},{'name':'Riccardo Caruso','goals':1}]})
          p.write_text(json.dumps(d,ensure_ascii=False))
          PY
          REPORT_BASELINE=/tmp/scorer-first-pass.json python scripts/reconcile_scorers_by_match.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/report.json').read_text())
          s={x['name']:x['goals'] for x in d['scorers']}
          assert s['Luis Nabulon']==9 and s['Riccardo Caruso']==3,s
          assert d['scorer_audit']['accounted_goals']==41
          Path('/tmp/after-new-match.json').write_text(json.dumps(d,ensure_ascii=False))
          print('NEW_MATCH_ADDED_ONCE',s['Luis Nabulon'],s['Riccardo Caruso'])
          PY
          REPORT_BASELINE=/tmp/after-new-match.json python scripts/reconcile_scorers_by_match.py
          python - <<'PY'
          import json
          d=json.load(open('data/report.json'))
          s={x['name']:x['goals'] for x in d['scorers']}
          assert s['Luis Nabulon']==9 and s['Riccardo Caruso']==3,s
          print('REPEATED_UPDATE_NOT_DOUBLE_COUNTED')
          with open('data/ifv-match-scorers.json',encoding='utf-8') as f:off=json.load(f)
          off['matches'].append({'date':'10.04.2027','opponent':'FC Altbüron-Grossdietwil','source_url':'https://matchcenter.ifv.ch/Default.aspx?test=match','scorers':[{'name':'Luis Nabulon','goals':2}]})
          with open('data/ifv-match-scorers.json','w',encoding='utf-8') as f:json.dump(off,f)
          PY
          REPORT_BASELINE=/tmp/after-new-match.json python scripts/reconcile_scorers_by_match.py
          python - <<'PY'
          import json
          d=json.load(open('data/report.json'))
          s={x['name']:x['goals'] for x in d['scorers']}
          assert s['Luis Nabulon']==10 and s['Riccardo Caruso']==2,s
          assert d['scorer_audit']['accounted_goals']==41
          m=[x for x in d['scorer_match_ledger']['matches'] if x['date']=='10.04.2027']
          assert len(m)==1 and m[0]['source']=='ifv' and m[0]['scorers']==[{'name':'Luis Nabulon','goals':2}]
          print('OFFICIAL_IFV_REPLACES_GAME_REPORT_INSTEAD_OF_ADDITION')
          PY
          cp /tmp/scorer-original.json data/report.json
          cp /tmp/ifv-original.json data/ifv-match-scorers.json
          git diff --exit-code -- data/report.json data/ifv-match-scorers.json
