name: Liga 4 Bericht aktualisieren
run-name: App-Update ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Interne ID des App-Updates
        required: false
        type: string
      comments_token:
        description: Kurzlebiger Zugriff auf freigegebene Matchkommentare
        required: false
        type: string
      update_review:
        description: Rückblick bei diesem Update erneuern
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: go-eschenbach-report-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ausgangsstand sichern
        run: cp data/report.json /tmp/report-before-update.json

      - name: Freigegebene Matchkommentare laden
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          COMMENTS_TOKEN: ${{ inputs.comments_token }}
          MATCH_COMMENTS_FILE: /tmp/go-eschenbach-match-comments.json
        run: python scripts/fetch_match_comments.py

      - name: Recherche und Bericht
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MATCH_COMMENTS_FILE: /tmp/go-eschenbach-match-comments.json
        run: python scripts/update_report.py

      - name: Spielplan prüfen und Bericht vertiefen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/enrich_report.py

      - name: Heutigen Spieltag abschliessend prüfen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/finalize_today.py

      - name: IFV-Livedaten versuchen
        id: ifv_live
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_BASELINE: /tmp/report-before-update.json
        run: python scripts/ifv_live_refresh.py

      - name: Matchkommentare endgültig in Rückblick einarbeiten
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MATCH_COMMENTS_FILE: /tmp/go-eschenbach-match-comments.json
        run: python scripts/apply_match_comments.py

      - name: Sprachliche Schlussredaktion
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/polish_language.py

      - name: Letzten korrekten Stand gegen Rueckschritte schuetzen
        if: always()
        env:
          REPORT_BASELINE: /tmp/report-before-update.json
        run: python scripts/protect_report_baseline.py

      - name: Torschützen gegen Rückschritte schützen
        if: always()
        env:
          REPORT_BASELINE: /tmp/report-before-update.json
        run: python scripts/protect_scorers.py

      - name: Bericht auf Widersprüche prüfen
        run: python scripts/validate_report.py

      - name: Rückblick auf bisherigen Stand zurücksetzen
        if: ${{ inputs.update_review == false }}
        env:
          REPORT_BASELINE: /tmp/report-before-update.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path('data/report.json')
          baseline_path = Path(os.environ['REPORT_BASELINE'])
          report = json.loads(report_path.read_text(encoding='utf-8'))
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          if 'review' in baseline:
              report['review'] = baseline['review']
              report_path.write_text(
                  json.dumps(report, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8'
              )
          PY

      - name: Bericht speichern
        run: |
          if git diff --quiet -- data/report.json; then
            echo "Keine Änderung am Bericht."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/report.json
          git commit -m "Liga-4-Bericht aus der App aktualisiert"
          git push
